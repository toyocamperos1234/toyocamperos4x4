<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com">

        <!-- Favicon -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/site.webmanifest?v=2">
    
    <style>
        body, html { margin:0; padding:0; height:100%; width:100%; }
        iframe { width:100%; height:100%; border:none; }
    </style>
</head>
<body>
    <script>
        var scriptUrl = "https://script.google.com/macros/s/AKfycbwO9zoNLYi77WoIVLcN3yFu6yyE8jBHWuseaXrTjj6eG3Dji97OptrekLIHEtyBorcG/exec";
        var params = window.location.search; // ya trae el "?" si existe
        if (params) scriptUrl += params;
        var iframe = document.createElement('iframe');
        iframe.src = scriptUrl;
        iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
        document.body.appendChild(iframe);
    </script>
</body>
</html>
